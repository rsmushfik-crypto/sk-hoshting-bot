<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বট হোস্ট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://libtl.com/sdk.js" data-zone="11885801" data-sdk="show_11885801"></script>
<style>
:root{
  --bg:#0b1020;--bg2:#121a33;--card:#141c36;--card2:#1b2548;
  --text:#eaf0ff;--hint:#8d9bbf;--line:rgba(140,160,230,.17);
  --a1:#3ea6ff;--a2:#7c5cff;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;
  --glow:rgba(92,120,255,.22);--code:#0a0f1f;--codetext:#dbe4ff;--logtext:#7ef0b8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f2f5fc;--bg2:#e9eefb;--card:#ffffff;--card2:#eef2fb;
  --text:#13203d;--hint:#667392;--line:rgba(30,50,110,.13);
  --a1:#2563eb;--a2:#7c3aed;--ok:#059669;--warn:#d97706;--bad:#dc2626;--glow:rgba(99,102,241,.16);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;color:var(--text);font-family:"Hind Siliguri",system-ui,sans-serif;font-size:15px;line-height:1.5;background:var(--bg)}
body{background:radial-gradient(120% 60% at 50% -10%,var(--glow),transparent 60%),var(--bg);min-height:100vh}
main{max-width:560px;margin:0 auto;padding:14px 14px 96px}
h2{font-size:17px;margin:20px 0 10px;font-weight:600}
.me{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;color:#fff;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 10px 30px -12px var(--a2)}
.av{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.7);display:grid;place-items:center;font-weight:700;font-size:21px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.me b{display:block;font-size:18px}
.me small{color:rgba(255,255,255,.82)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat:nth-child(1) b{color:var(--a1)}.stat:nth-child(2) b{color:var(--ok)}.stat:nth-child(3) b{color:var(--warn)}
.stat small{color:var(--hint)}
.bot{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--hint);border-radius:14px;padding:13px;margin-bottom:11px}
.bot.on{border-left-color:var(--ok)}.bot.err{border-left-color:var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0}
.name{font-weight:600}
.meta{color:var(--hint);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--hint);margin-right:7px}
.on.dot{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.pill{font-size:12px;padding:2px 10px;border-radius:20px;background:var(--card2);color:var(--hint)}
.on.pill{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.acts+.acts{margin-top:8px}
.acts.top{flex-wrap:nowrap;gap:6px}
.acts.top button{flex:1;padding:10px 2px;font-size:14px;white-space:nowrap;min-width:0}
.acts.ad{flex:1;width:100%;padding:14px;font-size:17px;font-weight:600}
.cd{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
button,.filebtn{font:inherit;border:0;border-radius:11px;padding:9px 15px;color:#fff;cursor:pointer;display:inline-block;text-align:center;
  background:linear-gradient(135deg,var(--a1),var(--a2))}
button.go{background:linear-gradient(135deg,#10b981,#34d399);color:#04281c}
button.stop{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
button.ghost,.filebtn{background:var(--card2);color:var(--text);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 55%,transparent)}
button:active,.filebtn:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,.filebtn:focus-within{outline:2px solid var(--a1);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.filebtn{position:relative}
label{display:block;margin:14px 0 5px;color:var(--hint);font-size:13px}
.filebtn{margin:0;color:var(--text);font-size:15px}
input[type=text],input:not([type]),select{width:100%;font:inherit;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--text)}
input:focus,select:focus{border-color:var(--a1)}
.full{width:100%;margin-top:18px;padding:13px}
textarea.code{width:100%;min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--code);color:var(--codetext);resize:vertical;tab-size:2;white-space:pre;caret-color:var(--a1)}
textarea.code:focus{outline:2px solid var(--a1);outline-offset:2px}
.log{background:#070b16;color:var(--logtext);font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--line);border-radius:12px;padding:12px;height:200px;overflow:auto;white-space:pre-wrap;margin-top:6px}
.empty{text-align:center;color:var(--hint);padding:30px 12px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--hint);border-radius:0;padding:13px 4px;position:relative}
nav button.act{color:var(--a1);font-weight:600}
nav button.act::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--a1),var(--a2))}
.view{display:none}.view.show{display:block}
.note{font-size:12px;color:var(--hint);margin-top:8px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50;padding:20px}
.dlg.show{display:grid}
.dbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:340px}
.dbox p{margin:0 0 4px;font-weight:600}
.dbox.acts button{flex:1}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:22px;opacity:0;transition:opacity.2s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section class="me">
    <div class="av" id="av">?</div>
    <div><b id="uname">লোড হচ্ছে…</b><small id="uinfo"></small></div>
  </section>
  <div class="view show" id="v-home">
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><small>মোট বট</small></div>
      <div class="stat"><b id="sOn">0</b><small>চালু</small></div>
      <div class="stat"><b id="sOff">0</b><small>বন্ধ</small></div>
    </div>
    <h2>আমার বট</h2>
    <div id="list"></div>
  </div>
  <div class="view" id="v-add">
    <h2>নতুন বট যোগ করুন</h2>
    <label for="bName">বটের নাম</label>
    <input id="bName" placeholder="যেমন: আমার শপ বট" maxlength="40">
    <label for="bToken">বট টোকেন (@BotFather থেকে)</label>
    <input id="bToken" placeholder="123456:ABC-DEF..." autocomplete="off">
    <label for="bLang">ভাষা</label>
    <select id="bLang"><option>Python</option><option>Node.js</option><option>PHP</option></select>
    <label for="bCode">বটের কোড (পরে এডিট করা যাবে)</label>
    <textarea id="bCode" class="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div class="acts"><label class="filebtn">ফাইল থেকে নিন<input type="file" id="fileIn" class="vh"></label></div>
    <button class="full" id="addBtn">বট যোগ করুন</button>
    <p class="note">টোকেন কখনো ফোনে সেভ হয় না। সার্ভারে পাঠানো হয়। লাইব্রেরি অটো ইনস্টল হবে।</p>
  </div>
  <div class="view" id="v-code">
    <h2>কোড এডিট: <span id="cName"></span></h2>
    <textarea id="dCode" class="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div class="acts">
      <button id="cSave">সেভ করুন</button>
      <label class="filebtn">ফাইল আপলোড<input type="file" id="fileEd" class="vh"></label>
    </div>
    <button class="ghost full" id="cBack">ফিরে যান</button>
  </div>
  <div class="view" id="v-log">
    <h2>লগ: <span id="lName"></span></h2>
    <div class="log" id="dLog"></div>
    <div class="acts">
      <button class="ghost" id="lRefresh">রিফ্রেশ</button>
      <button class="ghost" id="lBack">ফিরে যান</button>
    </div>
  </div>
  <div class="view" id="v-me">
    <h2>আমার তথ্য</h2>
    <div class="bot">
      <div class="row"><span class="meta">ইউজার আইডি</span><b id="pId">-</b></div>
      <div class="row"><span class="meta">ইউজারনেম</span><b id="pUser">-</b></div>
      <div class="row"><span class="meta">নাম</span><b id="pName">-</b></div>
      <div class="row"><span class="meta">ভাষা</span><b id="pLang">-</b></div>
    </div>
  </div>
</main>
<nav>
  <button class="act" data-v="home">হোম</button>
  <button data-v="add">নতুন বট</button>
  <button data-v="me">প্রোফাইল</button>
</nav>
<div class="dlg" id="dlg"><div class="dbox" role="dialog" aria-modal="true">
  <p id="dMsg"></p>
  <div class="acts"><button class="ghost" id="dNo">বাতিল</button><button class="stop" id="dYes">হ্যাঁ, মুছুন</button></div>
</div></div>
<div id="toast" role="status"></div>
<script>
const API_BASE = location.protocol.startsWith("http")? location.origin : "";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const dark = tg && tg.colorScheme? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
document.documentElement.dataset.theme = dark? "dark" : "light";
try { if (tg) { tg.setBackgroundColor(dark? "#0b1020" : "#f2f5fc"); tg.setHeaderColor(dark? "#0b1020" : "#f2f5fc"); } } catch (e) {}
const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const user = u || { id: 0, first_name: "গেস্ট", username: "", language_code: "bn" };
const fullName = [user.first_name, user.last_name].filter(Boolean).join(" ");
const $ = id => document.getElementById(id);
$("uname").textContent = fullName;
$("uinfo").textContent = (user.username? "@" + user.username : "ইউজারনেম নেই") + " · ID " + user.id;
$("pId").textContent = user.id;
$("pUser").textContent = user.username? "@" + user.username : "নেই";
$("pName").textContent = fullName;
$("pLang").textContent = user.language_code || "-";
if (user.photo_url) { const i = new Image(); i.src = user.photo_url; i.alt = ""; $("av").textContent = ""; $("av").appendChild(i); }
else $("av").textContent = (user.first_name || "?")[0];
if (!u) toast("টেলিগ্রামের ভেতর থেকে খুলুন, তাহলে অটো লগইন হবে");
const KEY = "bots_" + user.id;
let bots = [];
try { bots = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { bots = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(bots)); } catch (e) {} };
async function api(path, body) {
  if (!API_BASE) return { ok: true };
  try {
    const r = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": tg? tg.initData : "" },
      body: JSON.stringify(body || {})
    });
    return await r.json();
  } catch (e) { return { ok: false, error: "সার্ভারে সংযোগ হয়নি" }; }
}
const TPL = {
  "Python": 'import os, requests, time\n\nTOKEN = os.environ["BOT_TOKEN"]\nAPI = f"https://api.telegram.org/bot{TOKEN}"\noffset = 0\n\nwhile True:\n r = requests.get(f"{API}/getUpdates", params={"offset": offset, "timeout": 30}).json()\n for u in r.get("result", []):\n offset = u["update_id"] + 1\n m = u.get("message")\n if m and "text" in m:\n requests.post(f"{API}/sendMessage", json={"chat_id": m["chat"]["id"], "text": "হ্যালো! " + m["text"]})\n time.sleep(1)\n',
  "Node.js": 'const TOKEN = process.env.BOT_TOKEN;\nconst API = `https://api.telegram.org/bot${TOKEN}`;\nlet offset = 0;\n\nasync function loop() {\n while (true) {\n const r = await (await fetch(`${API}/getUpdates?timeout=30&offset=${offset}`)).json();\n for (const u of r.result || []) {\n offset = u.update_id + 1;\n if (u.message && u.message.text) {\n await fetch(`${API}/sendMessage`, {\n method: "POST",\n headers: { "Content-Type": "application/json" },\n body: JSON.stringify({ chat_id: u.message.chat.id, text: "হ্যালো! " + u.message.text })\n });\n }\n }\n }\n}\nloop();\n',
  "PHP": '<?php\n$token = getenv("BOT_TOKEN");\n$api = "https://api.telegram.org/bot$token";\n$offset = 0;\nwhile (true) {\n $r = json_decode(file_get_contents("$api/getUpdates?timeout=30&offset=$offset"), true);\n foreach ($r["result"]?? [] as $u) {\n $offset = $u["update_id"] + 1;\n if (isset($u["message"]["text"])) {\n file_get_contents("$api/sendMessage?chat_id=". $u["message"]["chat"]["id"]. "&text=". urlencode("হ্যালো! ". $u["message"]["text"]));\n }\n }\n}\n'
};
/* ====== অটো লাইব্রেরি ডিটেক্ট - নতুন সিস্টেম ====== */
const PIP_MAP = {
  "yt_dlp": "yt-dlp==2024.5.27",
  "telegram": "python-telegram-bot==20.7",
  "aiogram": "aiogram==3.3.0",
  "pyrogram": "pyrogram==2.0.106",
  "telethon": "telethon==1.34.0",
  "flask": "Flask==3.0.3",
  "requests": "requests==2.31.0",
  "PIL": "Pillow==10.3.0",
  "cv2": "opencv-python==4.9.0.80",
  "openai": "openai==1.30.1",
  "pymongo": "pymongo==4.6.3"
};
function detectLibs(code) {
  const found = new Set();
  const re = /(?:from|import)\s+([a-zA-Z0-9_]+)/g;
  let m;
  while ((m = re.exec(code))!== null) {
    const name = m[1];
    if (PIP_MAP[name]) found.add(PIP_MAP[name]);
    const low = name.toLowerCase();
    if (PIP_MAP[low]) found.add(PIP_MAP[low]);
  }
  if (found.size === 0) found.add("python-telegram-bot==20.7");
  return Array.from(found);
}
const isTpl = v =>!v.trim() || Object.values(TPL).includes(v);
$("bCode").value = TPL["Python"];
$("bLang").onchange = () => { if (isTpl($("bCode").value)) $("bCode").value = TPL[$("bLang").value]; };
document.querySelectorAll("textarea.code").forEach(t => t.addEventListener("keydown", e => {
  if (e.key === "Tab") { e.preventDefault(); const s = t.selectionStart; t.setRangeText(" ", s, t.selectionEnd, "end"); }
}));
function pickFile(input, target) {
  $(input).onchange = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (f.size > 500000) { e.target.value = ""; return toast("ফাইল ৫০০ KB এর বেশি হতে পারবে না"); }
    const rd = new FileReader();
    rd.onload = () => { $(target).value = String(rd.result); toast(f.name + " লোড হয়েছে"); e.target.value = ""; };
    rd.onerror = () => toast("ফাইল পড়া যায়নি, কোড পেস্ট করুন");
    rd.readAsText(f);
  };
}
pickFile("fileIn", "bCode");
pickFile("fileEd", "dCode");
let current = null;
function show(v) {
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("show", x.id === "v-" + v));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("act", b.dataset.v === v));
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.v));
function toast(m) {
  const t = $("toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stamp = () => new Date().toLocaleTimeString("bn-BD");
const HOURS = 4, FREE_HOURS = 1;
function fmt(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60;
  const n = x => x.toLocaleString("bn-BD", { minimumIntegerDigits: 2 });
  return `${n(h)} ঘণ্টা ${n(m)} মিনিট ${n(sec)} সেকেন্ড`;
}
function fillCd() {
  const now = Date.now();
  document.querySelectorAll(".cd").forEach(e => {
    const r = (+e.dataset.u || 0) - now;
    e.textContent = r > 0? fmt(r) : "নেই, এড দেখুন";
  });
}
function tick() {
  const now = Date.now(); let changed = false;
  bots.forEach(b => {
    if (b.status === "on" && (b.until || 0) <= now) {
      b.status = "off"; b.log.push(`[${stamp()}] সময় শেষ, বট বন্ধ হয়েছে`); changed = true; api("/bot/stop", { id: b.id });
    }
  });
  if (changed) { save(); render(); toast("সময় শেষ, বট বন্ধ হয়েছে"); }
  fillCd();
}
function ask(msg, yes) {
  const d = $("dlg"), close = () => d.classList.remove("show");
  $("dMsg").textContent = msg; d.classList.add("show");
  $("dNo").onclick = close;
  $("dYes").onclick = () => { close(); yes(); };
}
function render() {
  const on = bots.filter(b => b.status === "on").length;
  $("sTotal").textContent = bots.length; $("sOn").textContent = on; $("sOff").textContent = bots.length - on;
  const el = $("list");
  if (!bots.length) { el.innerHTML = '<div class="empty">এখনো কোনো বট নেই।<br>নিচের "নতুন বট" থেকে প্রথমটি যোগ করুন।</div>'; return; }
  el.innerHTML = bots.map(b => `
    <div class="bot ${b.status}">
      <div class="row"><div><div class="name"><span class="dot"></span>${esc(b.name)}</div>
      <div class="meta">${esc(b.lang)} · টোকেন ${esc(b.mask)}</div>
      <div class="meta">বাকি সময়: <span class="cd" data-u="${b.until || 0}"></span></div></div>
      <span class="pill">${b.status === "on"? "চালু" : "বন্ধ"}</span></div>
      <div class="acts top">
        <button class="${b.status === "on"? "stop" : "go"}" data-t="${b.id}">${b.status === "on"? "বন্ধ করুন" : "চালু করুন"}</button>
        <button class="ghost" data-e="${b.id}">কোড এডিট</button>
        <button class="ghost" data-o="${b.id}">লগ দেখুন</button>
        <button class="danger" data-d="${b.id}">ডিলিট</button>
      </div>
      <div class="acts">
        <button class="ad" data-a="${b.id}">এড দেখুন (+${HOURS.toLocaleString("bn-BD")} ঘণ্টা)</button>
      </div>
    </div>`).join("");
  el.querySelectorAll("[data-t]").forEach(x => x.onclick = () => toggle(x.dataset.t));
  el.querySelectorAll("[data-e]").forEach(x => x.onclick = () => openCode(x.dataset.e));
  el.querySelectorAll("[data-o]").forEach(x => x.onclick = () => openLog(x.dataset.o));
  el.querySelectorAll("[data-a]").forEach(x => x.onclick = () => watchAd(x.dataset.a));
  el.querySelectorAll("[data-d]").forEach(x => x.onclick = () => del(x.dataset.d));
  fillCd();
}
async function toggle(id) {
  const b = bots.find(x => x.id === id); if (!b) return;
  if (b.status!== "on" && (b.until || 0) <= Date.now()) return toast("আগে এড দেখে ৪ ঘণ্টা সময় নিন");
  const to = b.status === "on"? "off" : "on";
  const r = await api(to === "on"? "/bot/start" : "/bot/stop", { id });
  if (!r.ok) return toast(r.error || "কাজটি হয়নি");
  b.status = to; b.log.push(`[${stamp()}] বট ${to === "on"? "চালু হয়েছে" : "বন্ধ হয়েছে"}`);
  save(); render();
}
const AD_ZONE = "11885801", AD_FN = "show_" + AD_ZONE;
let adLoading = null;
function loadAd() {
  if (typeof window[AD_FN] === "function") return Promise.resolve();
  if (adLoading) return adLoading;
  adLoading = new Promise((res, rej) => {
    const urls = ["https://libtl.com/sdk.js", "https://libtl.com/sdk.js?r=" + Date.now()];
    let i = 0;
    const next = () => {
      if (i >= urls.length) { adLoading = null; return rej(new Error("ad load")); }
      const sc = document.createElement("script");
      sc.src = urls[i++]; sc.async = true; sc.dataset.zone = AD_ZONE; sc.dataset.sdk = AD_FN;
      sc.onload = () => typeof window[AD_FN] === "function"? res() : next();
      sc.onerror = () => { sc.remove(); next(); };
      document.head.appendChild(sc);
    };
    next();
  });
  return adLoading;
}
loadAd().catch(() => {});
let adBusy = false;
async function watchAd(id) {
  const b = bots.find(x => x.id === id); if (!b || adBusy) return;
  adBusy = true;
  try { await loadAd(); }
  catch (e) { adBusy = false; return toast("এড লোড হয়নি। অ্যাড-ব্লকার বন্ধ করে আবার চেষ্টা করুন"); }
  const st = await api("/ad/start", { id });
  if (!st.ok) { adBusy = false; return toast(st.error || "এড শুরু করা যায়নি"); }
  try { await window[AD_FN](); }
  catch (e) { adBusy = false; return toast("এড শেষ পর্যন্ত দেখা হয়নি"); }
  const until = Math.max(Date.now(), b.until || 0) + HOURS * 3600000;
  const r = await api("/bot/extend", { id, until, hours: HOURS, nonce: st.nonce });
  adBusy = false;
  if (!r.ok) return toast(r.error || "সময় যোগ হয়নি");
  b.until = r.until || until; b.status = "on";
  b.log.push(`[${stamp()}] এড দেখা হয়েছে, বট ${HOURS} ঘণ্টা সক্রিয়`);
  save(); render(); toast("বট ৪ ঘণ্টার জন্য সক্রিয় হয়েছে");
}
function del(id) {
  const b = bots.find(x => x.id === id); if (!b) return;
  ask(`"${b.name}" বট মুছে ফেলবেন?`, async () => {
    await api("/bot/delete", { id });
    bots = bots.filter(x => x.id!== id); save(); render(); toast("বট মুছে ফেলা হয়েছে");
  });
}
function openCode(id) {
  const b = bots.find(x => x.id === id); if (!b) return;
  current = id; $("cName").textContent = b.name; $("dCode").value = b.code || ""; show("code");
}
$("cSave").onclick = async () => {
  const b = bots.find(x => x.id === current); if (!b) return;
  const code = $("dCode").value;
  if (!code.trim()) return toast("কোড খালি রাখা যাবে না");
  const libs = detectLibs(code);
  toast("অটো ডিটেক্ট: " + libs.join(", "));
  const r = await api("/bot/code", { id: current, code, requirements: libs.join("\n"), restart: b.status === "on" });
  if (!r.ok) return toast(r.error || "সেভ হয়নি");
  b.code = code; b.log.push(`[${stamp()}] কোড সেভ হয়েছে (${libs.join(", ")})`); save(); toast("কোড সেভ হয়েছে, লাইব্রেরি ইনস্টল হচ্ছে");
};
$("cBack").onclick = () => show("home");
function paintLog(b) {
  const l = $("dLog"); l.textContent = b.log.length? b.log.join("\n") : "এখনো কোনো লগ নেই।"; l.scrollTop = l.scrollHeight;
}
async function openLog(id) {
  const b = bots.find(x => x.id === id); if (!b) return;
  current = id; $("lName").textContent = b.name; paintLog(b); show("log");
  if (API_BASE) {
    const r = await api("/bot/logs", { id });
    if (r.ok && Array.isArray(r.log)) { b.log = r.log; save(); if (current === id) paintLog(b); }
  }
}
$("lRefresh").onclick = () => current && openLog(current);
$("lBack").onclick = () => show("home");
$("addBtn").onclick = async () => {
  const name = $("bName").value.trim(), token = $("bToken").value.trim();
  if (!name) return toast("বটের নাম লিখুন");
  if (!/^\d{6,12}:[\w-]{30,}$/.test(token)) return toast("টোকেনটি সঠিক নয়");
  const code = $("bCode").value;
  if (!code.trim()) return toast("বটের কোড লিখুন");
  const libs = detectLibs(code);
  toast("অটো ডিটেক্ট: " + libs.join(", ") + " ইনস্টল হবে");
  const bot = { id: "b" + Date.now(), name, lang: $("bLang").value, code,
    mask: token.slice(0, 4) + "••••" + token.slice(-4), status: "on", until: Date.now() + FREE_HOURS * 3600000,
    log: [`[${stamp()}] বট যোগ করা হয়েছে`, `[${stamp()}] ${FREE_HOURS} ঘণ্টা ফ্রী সময় পাওয়া গেছে`, `[${stamp()}] লাইব্রেরি: ${libs.join(", ")}`] };
  const r = await api("/bot/create", {...bot, token, requirements: libs.join("\n") });
  if (!r.ok) return toast(r.error || "যোগ করা যায়নি");
  if (r.bot) Object.assign(bot, r.bot);
  bots.unshift(bot); save();
  ["bName", "bToken"].forEach(i => $(i).value = "");
  $("bCode").value = TPL[$("bLang").value];
  render(); show("home"); toast(bot.status === "on"? "বট যোগ হয়েছে, লাইব্রেরি অটো ইনস্টল হচ্ছে" : "বট যোগ হয়েছে");
};
(async function sync() {
  if (!API_BASE) return;
  const r = await api("/bot/list");
  if (r && r.ok) { bots = r.bots.map(b => ({...b, log: [] })); save(); render(); }
  else if (r && r.error) toast(r.error);
})();
render();
tick();
setInterval(tick, 1000);
</script>
